[project]
name = "codebot"
version = "0.2.0"
description = "轻量级终端 AI Coding Agent — ReAct + Plan Mode 双模式，五层分层架构，多 Agent 协作"
requires-python = ">=3.11"
dependencies = [
    "textual>=2.1.0",
    "anthropic>=0.42.0",
    "openai>=1.60.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "mcp>=1.12.0",
    "httpx>=0.27.0",
]

# RAG 扩展依赖（第一期+第二期+第三期）。
# 不装也能用项目原有全部功能；装了则启用语义检索能力。
# - qdrant-client：向量库（默认嵌入式模式，无需起服务，clone 即用）
# 注：BM25 用项目自实现的 rag/bm25.py，不引外部包，保持轻量。
[project.optional-dependencies]
rag = [
    "qdrant-client>=1.7.0",
]

[project.scripts]
codebot = "codebot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["codebot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
