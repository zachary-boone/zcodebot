[project]
name = "codebot"
version = "0.2.0"
description = "轻量级终端 AI Coding Agent — ReAct + Plan Mode 双模式，五层分层架构，多 Agent 协作"
requires-python = ">=3.11"
dependencies = [
    "textual>=2.1.0",
    "anthropic>=0.42.0",
    "openai>=1.60.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "mcp>=1.12.0",
    "httpx>=0.27.0",
]

[project.scripts]
codebot = "codebot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["codebot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
